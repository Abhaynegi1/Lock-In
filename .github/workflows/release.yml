name: Build & Publish Release

on:
  push:
    tags:
      - 'v*' # Triggers whenever you push a version tag, e.g. v1.0.0, v1.0.1
  workflow_dispatch: # Allows you to manually trigger a release from GitHub Actions tab

permissions:
  contents: write

jobs:
  release-apk:
    name: Build & Publish Android Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Release Asset
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk LockIn-Android.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: LockIn-Android.apk
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
